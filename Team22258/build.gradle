apply plugin: 'com.android.application'

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode.team22258'

    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }

    // 1. Define the dimension name
    flavorDimensions "robotVersion"

    // 2. Define your two robot iterations dynamically
    productFlavors {
        v1 {
            dimension "robotVersion"
            sourceSets {
                main {
                    java {
                        srcDirs = ['src/main/java'] // Point to the root java directory
                        include '**/team22258/**'   // Force inclusion of V1
                        exclude '**/team22258_V2/**' // Completely hide and ignore V2
                        exclude '**/legacy/**'
                    }
                }
            }
        }
        v2 {
            dimension "robotVersion"
            sourceSets {
                main {
                    java {
                        srcDirs = ['src/main/java'] // Point to the root java directory
                        include '**/team22258_V2/**' // Force inclusion of V2
                        exclude '**/team22258/**'    // Completely hide and ignore V1
                        exclude '**/legacy/**'
                    }
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.pedropathing.com' }
    maven { url = 'https://mymaven.bylazar.com/releases' }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    // Team 22258-only libraries. Keep team-specific dependencies HERE, not in the
    // shared build.dependencies.gradle, so one team's libraries cannot break another's.
    implementation 'com.pedropathing:ftc:2.0.4'
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation 'com.bylazar:fullpanels:1.0.6'
}